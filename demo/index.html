<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Демо ИИ-сотрудника — ALTAI Optima</title>
  <link rel="stylesheet" href="../assets/css/vera-demo-chat.css">
  <style>
    body { margin: 0; font-family: Inter, system-ui, sans-serif; background: #fafafa; color: #18181b; }
    .wrap { max-width: 720px; margin: 0 auto; padding: 16px; display: flex; flex-direction: column; min-height: 100vh; box-sizing: border-box; }
    header { display: flex; align-items: center; gap: 12px; padding: 8px 0 16px; }
    header img { height: 44px; border-radius: 8px; }
    header h1 { font-size: 20px; margin: 0; }
    header p { margin: 2px 0 0; font-size: 13px; opacity: .7; }
    #chat { flex: 1; background: #fff; border: 1px solid #e4e4e7; border-radius: 14px; overflow: hidden; display: flex; min-height: 70vh; }
    #chat > .vdc-root { width: 100%; }
    .err { padding: 40px 16px; text-align: center; opacity: .7; }
    @media (prefers-color-scheme: dark) { body { background: #09090b; color: #fafafa; } #chat { background: #18181b; border-color: #3f3f46; } }
  </style>
</head>
<body>
  <div class="wrap">
    <header id="hdr"><div><h1>Демо ИИ-сотрудника</h1></div></header>
    <div id="chat"></div>
  </div>
  <script src="../assets/js/vera-demo-chat.js"></script>
  <script>
    (function () {
      var t = new URLSearchParams(location.search).get('t');
      var chatEl = document.getElementById('chat');
      if (!t || !/^[a-z0-9_]{1,64}$/.test(t)) {
        chatEl.innerHTML = '<div class="err">Укажите демо в адресе: ?t=&lt;id&gt;</div>';
        return;
      }
      VeraDemoChat.mount(chatEl, { tenantId: t }).then(function (r) {
        var c = r.config, h = document.getElementById('hdr');
        document.title = (c.business_name || 'Демо') + ' — ИИ-сотрудник';
        var safe = VeraDemoChat.escapeHtml;
        var logo = c.logo_url && /^(https?:)?\/\//.test(c.logo_url) ? '<img alt="" src="' + safe(c.logo_url) + '">' : '';
        h.innerHTML = logo + '<div><h1>' + safe(c.business_name || '') + '</h1>' +
          (c.tagline || c.hero_description ? '<p>' + safe(c.tagline || c.hero_description) + '</p>' : '') + '</div>';
      }).catch(function (e) {
        chatEl.innerHTML = '<div class="err">' + VeraDemoChat.escapeHtml(e.message) + '</div>';
      });
    })();
  </script>
</body>
</html>
